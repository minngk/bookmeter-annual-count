<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>読書メーター 年間冊数</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 220px;
      padding: 16px;
      color: #333;
      background: #fff;
    }

    h1 {
      font-size: 13px;
      color: #888;
      margin-bottom: 12px;
      font-weight: normal;
    }

    /* userId入力フォーム */
    #setup-section {
      display: none;
    }

    #setup-section label {
      font-size: 12px;
      color: #555;
      display: block;
      margin-bottom: 4px;
    }

    #user-id-input {
      width: 100%;
      padding: 6px 8px;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-bottom: 8px;
      outline: none;
    }

    #user-id-input:focus {
      border-color: #4a90d9;
    }

    /* メインコンテンツ */
    #main-section {
      display: none;
    }

    #count-display {
      text-align: center;
      margin: 8px 0 12px;
    }

    #count-value {
      font-size: 48px;
      font-weight: bold;
      color: #4a90d9;
      line-height: 1;
    }

    #count-unit {
      font-size: 14px;
      color: #555;
      margin-top: 2px;
    }

    #updated-at {
      font-size: 11px;
      color: #aaa;
      text-align: center;
      margin-bottom: 10px;
    }

    /* 未ログイン */
    #login-section {
      display: none;
      font-size: 12px;
      color: #c0392b;
      text-align: center;
      padding: 8px 0;
      line-height: 1.5;
    }

    /* ボタン共通 */
    button {
      width: 100%;
      padding: 7px;
      font-size: 13px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s;
    }

    #save-btn {
      background: #4a90d9;
      color: #fff;
    }

    #save-btn:hover { background: #357abd; }

    #refresh-btn {
      background: #f0f0f0;
      color: #444;
    }

    #refresh-btn:hover { background: #e0e0e0; }
    #refresh-btn:disabled { opacity: 0.5; cursor: default; }

    #status-msg {
      font-size: 11px;
      color: #888;
      text-align: center;
      margin-top: 6px;
      min-height: 16px;
    }

  </style>
</head>
<body>
  <h1>読書メーター 年間冊数</h1>

  <!-- 初回設定 -->
  <div id="setup-section">
    <label for="user-id-input">ユーザーID（URLの数字部分）</label>
    <input id="user-id-input" type="text" placeholder="例: 1234567" inputmode="numeric">
    <button id="save-btn">保存して取得</button>
  </div>

  <!-- メイン表示 -->
  <div id="main-section">
    <div id="count-display">
      <div id="count-value">–</div>
      <div id="count-unit">冊 / 今年</div>
    </div>
    <div id="updated-at"></div>
    <button id="refresh-btn">手動更新</button>
    <div id="status-msg"></div>
  </div>

  <!-- 未ログイン -->
  <div id="login-section">
    読書メーターにログインしてください
  </div>

  <script src="popup.js"></script>
</body>
</html>
